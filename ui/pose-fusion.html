<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuView — Pose Fusion</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #050510; --bg2: #0a0a1e; --bg3: #0f1028;
      --border: #1a2040; --accent: #0088ff; --accent2: #00ccff;
      --green: #00e676; --red: #ff3d57; --yellow: #ffd740;
      --dim: #334466; --text: #c8d8f0; --text-dim: #5577aa;
      --font: 'Courier New', 'Consolas', monospace;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; overflow: hidden; }
    #shell { display: flex; flex-direction: column; height: 100vh; }
    #main { flex: 1; display: grid; grid-template-columns: 1fr 320px; gap: 0; overflow: hidden; }

    /* Skeleton viewport */
    #pose-viewport { position: relative; background: #020208; overflow: hidden; }
    #skeleton-canvas { width: 100%; height: 100%; display: block; }
    #pose-status {
      position: absolute; top: 12px; left: 12px;
      background: rgba(5,5,16,0.85); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 14px; font-size: 11px;
    }
    .status-row { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-dot.off  { background: var(--dim); }

    /* Side panel */
    #side { background: var(--bg2); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .panel { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
    .panel-title { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent2); margin-bottom: 8px; }
    .metric-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 11px; }
    .metric-label { color: var(--text-dim); }
    .metric-val { color: var(--text); font-weight: bold; }
    .metric-val.ok { color: var(--green); } .metric-val.warn { color: var(--yellow); } .metric-val.err { color: var(--red); }

    /* CSI amplitude bar */
    #csi-canvas { width: 100%; height: 80px; display: block; background: #020208; border-radius: 4px; }
    /* RSSI sparkline */
    #rssi-canvas { width: 100%; height: 48px; display: block; background: #020208; border-radius: 4px; }

    /* Responsive: stack on narrow screens */
    @media (max-width: 700px) { #main { grid-template-columns: 1fr; } #side { border-left: none; border-top: 1px solid var(--border); max-height: 40vh; } }
  </style>
</head>
<body>
<div id="shell">
  <nav id="global-nav"></nav>
  <div id="main">
    <div id="pose-viewport">
      <canvas id="skeleton-canvas"></canvas>
      <div id="pose-status">
        <div class="status-row"><span class="status-dot off" id="ws-dot"></span><span id="ws-label">Connecting…</span></div>
        <div class="status-row"><span id="tick-label" style="color:var(--text-dim)">tick: --</span></div>
        <div class="status-row"><span id="persons-label" style="color:var(--text-dim)">Persons: --</span></div>
      </div>
    </div>
    <div id="side">
      <div class="panel">
        <div class="panel-title">Presence</div>
        <div class="metric-row"><span class="metric-label">Detected</span><span class="metric-val" id="p-presence">--</span></div>
        <div class="metric-row"><span class="metric-label">Confidence</span><span class="metric-val" id="p-conf">--</span></div>
        <div class="metric-row"><span class="metric-label">Motion</span><span class="metric-val" id="p-motion">--</span></div>
        <div class="metric-row"><span class="metric-label">Persons</span><span class="metric-val" id="p-count">--</span></div>
      </div>
      <div class="panel">
        <div class="panel-title">Vital Signs</div>
        <div class="metric-row"><span class="metric-label">Heart Rate</span><span class="metric-val" id="p-hr">-- BPM</span></div>
        <div class="metric-row"><span class="metric-label">Breathing</span><span class="metric-val" id="p-br">-- RPM</span></div>
        <div class="metric-row"><span class="metric-label">Signal Quality</span><span class="metric-val" id="p-sq">--</span></div>
      </div>
      <div class="panel">
        <div class="panel-title">CSI Amplitude</div>
        <canvas id="csi-canvas" width="290" height="80"></canvas>
      </div>
      <div class="panel">
        <div class="panel-title">RSSI History</div>
        <canvas id="rssi-canvas" width="290" height="48"></canvas>
        <div class="metric-row" style="margin-top:4px"><span class="metric-label">Current</span><span class="metric-val" id="p-rssi">-- dBm</span></div>
      </div>
      <div class="panel">
        <div class="panel-title">Signal Features</div>
        <div class="metric-row"><span class="metric-label">Variance</span><span class="metric-val" id="p-var">--</span></div>
        <div class="metric-row"><span class="metric-label">Spectral Power</span><span class="metric-val" id="p-spec">--</span></div>
        <div class="metric-row"><span class="metric-label">Dominant Freq</span><span class="metric-val" id="p-freq">-- Hz</span></div>
        <div class="metric-row"><span class="metric-label">Breathing Band</span><span class="metric-val" id="p-bband">--</span></div>
        <div class="metric-row"><span class="metric-label">Motion Band</span><span class="metric-val" id="p-mband">--</span></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { injectNav, NAV_CSS } from './shared/nav.js';
const st = document.createElement('style'); st.textContent = NAV_CSS; document.head.appendChild(st);
injectNav();

const $ = id => document.getElementById(id);
const WS_URL = `ws://${location.hostname}:8765`;

// COCO-17 skeleton pairs for drawing bones
const BONES = [[0,1],[0,2],[1,3],[2,4],[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];
const JOINT_COLORS = ['#ff4060','#ff6040','#ff8020','#ffb020','#ffd740','#d0ff40','#80ff40','#40ff60','#00e676','#00d8a0','#00cccc','#00b8ff','#0088ff','#4060ff','#8040ff','#c040ff','#ff40e0'];

// Canvas setup
const skCanvas = $('skeleton-canvas');
const skCtx = skCanvas.getContext('2d');
const csiCanvas = $('csi-canvas');
const csiCtx = csiCanvas.getContext('2d');
const rssiCanvas = $('rssi-canvas');
const rssiCtx = rssiCanvas.getContext('2d');

const rssiHistory = [];
const RSSI_MAX = 100;

function resizeSkeleton() {
  const vp = $('pose-viewport');
  skCanvas.width = vp.clientWidth;
  skCanvas.height = vp.clientHeight;
}
resizeSkeleton();
window.addEventListener('resize', resizeSkeleton);

// WebSocket
let ws = null;
function connect() {
  if (ws && ws.readyState <= 1) return;
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    $('ws-dot').className = 'status-dot live';
    $('ws-label').textContent = 'Live';
  };
  ws.onmessage = (evt) => { try { onData(JSON.parse(evt.data)); } catch {} };
  ws.onclose = () => {
    $('ws-dot').className = 'status-dot off';
    $('ws-label').textContent = 'Reconnecting…';
    setTimeout(connect, 2000);
  };
  ws.onerror = () => ws.close();
}

function onData(d) {
  $('tick-label').textContent = `tick: ${d.tick || 0}`;

  // Classification
  const cls = d.classification || {};
  $('p-presence').textContent = cls.presence ? 'YES' : 'NO';
  $('p-presence').className = 'metric-val ' + (cls.presence ? 'ok' : '');
  $('p-conf').textContent = ((cls.confidence || 0) * 100).toFixed(0) + '%';
  const em = d.enhanced_motion || {};
  $('p-motion').textContent = (em.level || cls.motion_level || '--').toUpperCase();

  // Persons
  const persons = d.persons || [];
  const estPersons = d.estimated_persons || (cls.presence ? 1 : 0);
  $('p-count').textContent = persons.length || estPersons;
  $('persons-label').textContent = `Persons: ${persons.length || estPersons}`;

  // Vitals
  const vs = d.vital_signs || {};
  $('p-hr').textContent = vs.heart_rate_bpm ? vs.heart_rate_bpm.toFixed(0) + ' BPM' : '-- BPM';
  $('p-hr').style.color = vs.heart_rate_bpm > 0 ? '#ff4060' : '';
  $('p-br').textContent = vs.breathing_rate_bpm ? vs.breathing_rate_bpm.toFixed(1) + ' RPM' : '-- RPM';
  $('p-br').style.color = vs.breathing_rate_bpm > 0 ? '#00e676' : '';
  $('p-sq').textContent = vs.signal_quality ? (vs.signal_quality * 100).toFixed(0) + '%' : '--';

  // Features
  const f = d.features || {};
  $('p-rssi').textContent = f.mean_rssi != null ? f.mean_rssi.toFixed(0) + ' dBm' : '-- dBm';
  $('p-var').textContent = f.variance != null ? f.variance.toFixed(4) : '--';
  $('p-spec').textContent = f.spectral_power != null ? f.spectral_power.toExponential(1) : '--';
  $('p-freq').textContent = f.dominant_freq_hz != null ? f.dominant_freq_hz.toFixed(2) + ' Hz' : '-- Hz';
  $('p-bband').textContent = f.breathing_band_power != null ? f.breathing_band_power.toFixed(4) : '--';
  $('p-mband').textContent = f.motion_band_power != null ? f.motion_band_power.toFixed(4) : '--';

  // Draw skeleton from pose_keypoints or persons
  drawSkeleton(d.pose_keypoints, persons);

  // CSI amplitude from nodes
  drawCSI(d.nodes || []);

  // RSSI sparkline
  if (f.mean_rssi != null) {
    rssiHistory.push(f.mean_rssi);
    if (rssiHistory.length > RSSI_MAX) rssiHistory.shift();
    drawRSSI();
  }
}

function drawSkeleton(keypoints, persons) {
  const w = skCanvas.width, h = skCanvas.height;
  skCtx.clearRect(0, 0, w, h);

  // Draw room grid
  skCtx.strokeStyle = 'rgba(0,136,255,0.08)';
  skCtx.lineWidth = 1;
  for (let x = 0; x < w; x += 40) { skCtx.beginPath(); skCtx.moveTo(x, 0); skCtx.lineTo(x, h); skCtx.stroke(); }
  for (let y = 0; y < h; y += 40) { skCtx.beginPath(); skCtx.moveTo(0, y); skCtx.lineTo(w, y); skCtx.stroke(); }

  // Draw label
  skCtx.fillStyle = 'rgba(200,216,240,0.15)';
  skCtx.font = '10px Courier New';
  skCtx.fillText('WIFI CSI POSE ESTIMATION — LIVE', 12, 20);

  // If we have pose_keypoints, draw them
  if (keypoints && keypoints.length > 0) {
    drawKeypointSkeleton(keypoints, w, h, '#00e676');
    return;
  }

  // If we have person detections, draw each
  if (persons && persons.length > 0) {
    const colors = ['#00e676', '#00ccff', '#ff6040', '#ffd740'];
    persons.forEach((p, i) => {
      if (p.keypoints) drawKeypointSkeleton(p.keypoints, w, h, colors[i % colors.length]);
      // Draw position marker if no keypoints
      if (!p.keypoints && p.position) {
        const px = p.position[0] * w;
        const py = p.position[2] * h;
        skCtx.beginPath();
        skCtx.arc(px, py, 12, 0, Math.PI * 2);
        skCtx.fillStyle = colors[i % colors.length] + '40';
        skCtx.fill();
        skCtx.strokeStyle = colors[i % colors.length];
        skCtx.lineWidth = 2;
        skCtx.stroke();
      }
    });
    return;
  }

  // No keypoints — show "awaiting model" message
  skCtx.fillStyle = 'rgba(200,216,240,0.3)';
  skCtx.font = '14px Courier New';
  skCtx.textAlign = 'center';
  skCtx.fillText('Awaiting pose data from WiFi CSI', w / 2, h / 2 - 10);
  skCtx.font = '10px Courier New';
  skCtx.fillText('Load a trained .rvf model to enable skeleton rendering', w / 2, h / 2 + 12);
  skCtx.textAlign = 'start';
}

function drawKeypointSkeleton(kps, w, h, color) {
  const padX = w * 0.1, padY = h * 0.05;
  const scaleX = w * 0.8, scaleY = h * 0.9;

  // Draw bones
  skCtx.lineWidth = 3;
  skCtx.lineCap = 'round';
  for (const [a, b] of BONES) {
    if (a >= kps.length || b >= kps.length) continue;
    const [ax, ay, , ac] = kps[a];
    const [bx, by, , bc] = kps[b];
    if (ac < 0.1 || bc < 0.1) continue;
    const alpha = Math.min(ac, bc);
    skCtx.strokeStyle = color + Math.floor(alpha * 200).toString(16).padStart(2, '0');
    skCtx.beginPath();
    skCtx.moveTo(padX + ax * scaleX, padY + ay * scaleY);
    skCtx.lineTo(padX + bx * scaleX, padY + by * scaleY);
    skCtx.stroke();
  }

  // Draw joints
  kps.forEach(([x, y, , conf], i) => {
    if (conf < 0.1) return;
    const px = padX + x * scaleX;
    const py = padY + y * scaleY;
    const r = 4 + conf * 4;
    skCtx.beginPath();
    skCtx.arc(px, py, r, 0, Math.PI * 2);
    skCtx.fillStyle = JOINT_COLORS[i % JOINT_COLORS.length];
    skCtx.fill();
    skCtx.strokeStyle = '#fff';
    skCtx.lineWidth = 1;
    skCtx.stroke();
  });
}

function drawCSI(nodes) {
  const w = csiCanvas.width, h = csiCanvas.height;
  csiCtx.clearRect(0, 0, w, h);
  if (!nodes.length) return;
  const amps = nodes[0].amplitude || [];
  if (!amps.length) return;
  let mx = 0; for (const a of amps) if (a > mx) mx = a;
  if (!mx) mx = 1;
  const barW = w / amps.length;
  amps.forEach((a, i) => {
    const norm = a / mx;
    const bh = norm * h * 0.9;
    const hue = 180 + norm * 60;
    csiCtx.fillStyle = `hsl(${hue}, 80%, ${30 + norm * 40}%)`;
    csiCtx.fillRect(i * barW, h - bh, barW - 0.5, bh);
  });
}

function drawRSSI() {
  const w = rssiCanvas.width, h = rssiCanvas.height;
  rssiCtx.clearRect(0, 0, w, h);
  if (rssiHistory.length < 2) return;
  // RSSI range: -100 to -20
  const min = -100, max = -20, range = max - min;
  rssiCtx.beginPath();
  rssiCtx.strokeStyle = '#00ccff';
  rssiCtx.lineWidth = 1.5;
  rssiHistory.forEach((v, i) => {
    const x = (i / (RSSI_MAX - 1)) * w;
    const y = h - ((v - min) / range) * h;
    i === 0 ? rssiCtx.moveTo(x, y) : rssiCtx.lineTo(x, y);
  });
  rssiCtx.stroke();
}

connect();
</script>
</body>
</html>
