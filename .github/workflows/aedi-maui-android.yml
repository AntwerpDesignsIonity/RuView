name: aedi-maui-android

# Builds the AEDI-S .NET MAUI client for Android on CI.
# Produces a signed-or-unsigned APK artifact; works on any fork.
on:
  push:
    paths:
      - 'releases/desktop/aedi-maui/**'
      - '.github/workflows/aedi-maui-android.yml'
  pull_request:
    paths:
      - 'releases/desktop/aedi-maui/**'
      - '.github/workflows/aedi-maui-android.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: releases/desktop/aedi-maui
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore -f net10.0-android

      - name: Build (Release)
        run: dotnet build -c Release -f net10.0-android --no-restore

      - name: Package APK
        run: dotnet publish -c Release -f net10.0-android -p:AndroidPackageFormat=apk --no-restore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AediMaui-android-apk
          path: releases/desktop/aedi-maui/bin/Release/net10.0-android/publish/*.apk
          if-no-files-found: warn
