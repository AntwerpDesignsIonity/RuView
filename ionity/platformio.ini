; AEDI Radar Node — CSI Sensing + LED Visual Interface
; ESP32-S3 N16R8 (16 MB flash / 8 MB PSRAM)
; Arduino framework + FastLED + ESP-IDF WiFi CSI API
; NVS keys (namespace csi_cfg): ssid, password, target_ip, target_port,
;   node_id, led_hub  — set with provision.py or directly via Preferences.

[env:esp32s3_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 460800
upload_speed = 460800
upload_protocol = esptool
board_upload.flash_size = 16MB
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCONFIG_ESP_WIFI_CSI_ENABLED=1

lib_deps =
	fastled/FastLED @ ^3.6.0

; WiFi and WiFiUdp are part of the esp32 Arduino core (no extra lib_dep needed).
; esp_wifi.h CSI API is part of the ESP-IDF bundled with espressif32 platform.
; Leave upload_port and monitor_port unset so PlatformIO auto-detects
; the connected ESP32-S3 device.

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-LCD-1.47 variant — same firmware + local LCD readout.
; Use only on the 1.47" ST7789 172x320 board (node 4). Other nodes stay on
; esp32s3_n16r8 so they don't try to drive non-existent SPI pins.
; Flash with:  pio run -e esp32s3_lcd_1_47 -t upload --upload-port /dev/ttyACM1
; ---------------------------------------------------------------------------
[env:esp32s3_lcd_1_47]
extends = env:esp32s3_n16r8
build_flags =
	${env:esp32s3_n16r8.build_flags}
	-DENABLE_LCD_ST7789_147
lib_deps =
	${env:esp32s3_n16r8.lib_deps}
	moononournation/GFX Library for Arduino @ 1.4.7

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-Touch-AMOLED-1.64 variant — CSI sensing firmware only.
;
; Pin map (Waveshare demo lcd_config.h):
;   LCD (SH8601 QSPI):  CS=9  PCLK=10  D0-D3=11..14  RST=21  (280x456, no BL)
;   Touch (FT3168 I2C): SDA=47  SCL=48  (addr 0x38)
;   ESP32-S3 R8 — OPI octal PSRAM (memory_type=qio_opi).
;
; DISPLAY STATUS: NOT SUPPORTED YET. The onboard panel controller is SH8601
; (not CO5300). SH8601 uses 32-bit QSPI command framing and has a different
; init sequence; Arduino_GFX does not ship an SH8601 driver. Enabling the
; existing CO5300 driver leaves the screen dark. Bringing it up requires
; porting Waveshare's own esp_lcd_sh8601.c (ESP-IDF panel API) or writing
; a new Arduino_GFX driver. Tracked as a separate task.
;
; Until then this env builds the standard CSI firmware with OPI PSRAM so the
; board still works as a sensing node (UDP CSI on port 5005).
; Flash with:  pio run -e esp32s3_amoled_1_64 -t upload --upload-port /dev/ttyACM0
; ---------------------------------------------------------------------------
[env:esp32s3_amoled_1_64]
extends = env:esp32s3_n16r8
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
build_flags =
	${env:esp32s3_n16r8.build_flags}
lib_deps =
	${env:esp32s3_n16r8.lib_deps}

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-Touch-LCD-2 variant — 2.4" IPS ST7789 (240x320).
;
; Pin map (verified vs CircuitPython board file):
;   LCD (ST7789 SPI):    SCLK=39  MOSI=38  MISO=40  DC=42  CS=45  RST=0  BL=1
;   Touch (CST816D I2C): SDA=48  SCL=47   INT=46  (not used for CSI readout)
;
; Flash with:  pio run -e esp32s3_touch_lcd_2 -t upload --upload-port /dev/ttyACM1
; ---------------------------------------------------------------------------
[env:esp32s3_touch_lcd_2]
extends = env:esp32s3_n16r8
build_flags =
	${env:esp32s3_n16r8.build_flags}
	-DENABLE_LCD_ST7789_240
lib_deps =
	${env:esp32s3_n16r8.lib_deps}
	moononournation/GFX Library for Arduino @ 1.4.7
