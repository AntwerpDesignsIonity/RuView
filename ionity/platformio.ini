; AEDI Radar Node — LED Visual Interface
; ESP32-S3 N16R8 (16 MB flash / 8 MB PSRAM)
; Arduino framework + FastLED for WS2812B built-in LED (GPIO 48)
; See docs/led.md for the full visual language specification.

[env:esp32s3_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 460800
upload_speed = 460800
upload_protocol = esptool
board_upload.flash_size = 16MB
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
	fastled/FastLED @ ^3.6.0

; Leave upload_port and monitor_port unset so PlatformIO auto-detects
; the connected ESP32-S3 device.
; PlatformIO exposes the generic esp32-s3-devkitc-1 board ID, so this
; environment uses that ID with 16 MB flash overrides for N16R8-style boards.
